name: Construire l'application Mac

# Compile l'application Mac à chaque fusion sur main (et vérifie chaque pull request qui la touche).
on:
  push:
    # main (versions publiées) et branches de travail claude/… (vérification).
    branches: [main, "claude/**"]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le projet Xcode
        run: |
          brew install xcodegen
          cd mac && xcodegen generate

      - name: Compiler l'application
        run: |
          cd mac
          xcodebuild -project LivreDeVoyage.xcodeproj -target LivreDeVoyage -configuration Release \
            SYMROOT="$PWD/build" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build

      - name: Emballer l'application
        run: |
          cd mac/build/Release
          ditto -c -k --keepParent "Livre de voyage.app" "$GITHUB_WORKSPACE/LivreDeVoyage-Mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LivreDeVoyage-Mac
          path: LivreDeVoyage-Mac.zip

      - name: Publier une version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v1.0.${{ github.run_number }}
          name: Livre de voyage pour Mac ${{ github.run_number }}
          files: LivreDeVoyage-Mac.zip
